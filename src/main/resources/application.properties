spring.application.name=school-plus
# La rellena Maven al filtrar los recursos. La pinta el panel de marca del login.
app.version=@project.version@
server.port=${SERVER_PORT:8080}

# ── Base de datos ───────────────────────────────────────────────────────────
# Esquema propio (school_plus) en el MISMO servidor MySQL que el resto de aplicativos.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/school_plus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# HikariCP dimensionado (§5.3). Origen de los valores: un proyecto de referencia.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# ── JPA ─────────────────────────────────────────────────────────────────────
# NUNCA "update": el esquema lo manda Flyway. Esta línea es la diferencia de fondo
# con los tres repos de referencia (ver docs/DECISIONES.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Dialecto EXPLÍCITO, y no es opcional. MariaDB se anuncia como "5.5.5-10.4.32-MariaDB"
# para compatibilidad, así que Hibernate deduce MySQL 5.5 y genera SQL que este motor no
# entiende. Se descubrió con el bloqueo pesimista del saldo de vacaciones: emitía
# "FOR UPDATE OF alias", que MariaDB rechaza con error de sintaxis.
# Si el servidor de producción resulta ser MySQL 8 de verdad, aquí va
# org.hibernate.dialect.MySQLDialect. Ver docs/DECISIONES.md D-012.
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MariaDBDialect}

# ── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ── Sesión ──────────────────────────────────────────────────────────────────
# Spring Session JDBC: el backend queda sin estado en memoria y admite varias
# instancias sin Redis (docs/DECISIONES.md D-007).
spring.session.store-type=jdbc
# Las tablas SPRING_SESSION las crea Flyway (V2), no Spring: cero DDL fuera de migraciones.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=${SESSION_TIMEOUT:8h}

# Cookie de sesión: mismo formato que los sistemas de origen (SESSION / HttpOnly / Lax),
# con Secure forzado en producción. Ver docs/DECISIONES.md
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# ── Seguridad (hito 2) ──────────────────────────────────────────────────────
# Coste de BCrypt. Los hashes heredados son $2a$10$ y se siguen leyendo; lo nuevo se
# cifra con 12. Ver docs/DECISIONES.md D-008.
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# Política de contraseñas. El original de un proyecto de referencia pedía 6 caracteres
# (hallazgo #5 de docs/DECISIONES.md).
app.security.password.longitud-minima=${PASSWORD_MIN_LENGTH:10}

# Vigencia del enlace de recuperación, en minutos. Origen: un proyecto de referencia (30).
app.security.reset.minutos-vigencia=${RESET_TOKEN_MINUTES:30}

# "Mantener sesión activa". La clave firma el token; si cambia, todos los
# recordatorios vigentes dejan de valer. SIN valor por defecto a propósito: la
# aplicación no arranca sin ella, para que nadie despliegue con una clave conocida.
app.security.remember-me.key=${REMEMBER_ME_KEY}
app.security.remember-me.dias=${REMEMBER_ME_DAYS:14}

# Límite de intentos (§4.1). Se cuenta sobre auditoria_acceso, no en memoria: el
# backend no guarda estado en el nodo (§5.3, docs/DECISIONES.md D-010).
app.security.rate-limit.login.max-por-cuenta=${LOGIN_MAX_POR_CUENTA:5}
app.security.rate-limit.login.max-por-ip=${LOGIN_MAX_POR_IP:20}
app.security.rate-limit.login.ventana-minutos=${LOGIN_VENTANA_MINUTOS:15}
app.security.rate-limit.reset.max-por-cuenta=${RESET_MAX_POR_CUENTA:3}
app.security.rate-limit.reset.max-por-ip=${RESET_MAX_POR_IP:10}
app.security.rate-limit.reset.ventana-minutos=${RESET_VENTANA_MINUTOS:60}

# ── Cuenta inicial ──────────────────────────────────────────────────────────
# Solo se usa si la base no tiene ningún ADMIN. La contraseña va por entorno; nunca
# se escribe aquí (hallazgo #1 de docs/DECISIONES.md).
app.bootstrap.admin-nombre=${BOOTSTRAP_ADMIN_NOMBRE:Administrador School_Plus}
app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
# Tres cuentas de prueba (supervisor/coordinador/colaborador) para validar el hito 2.
# NUNCA en producción.
app.bootstrap.demo-usuarios=${BOOTSTRAP_DEMO_USUARIOS:false}

# ── Solicitudes y vacaciones (hito 4) ───────────────────────────────────────
# Causación: 1,25 días hábiles por mes trabajado, confirmado por el usuario el
# 2026-08-26. Son los 15 días hábiles anuales de la ley colombiana repartidos mes a
# mes. Va en configuración y no en el código porque es una cifra legal.
app.vacaciones.dias-por-mes=${VACACIONES_DIAS_POR_MES:1.25}

# Qué días cuentan como hábiles al medir un permiso o unas vacaciones.
# OJO: los festivos NO se descuentan todavía — no hay calendario cargado y los de
# Colombia se mueven con la ley Emiliani. Ver docs/DECISIONES.md
app.vacaciones.dias-habiles=${VACACIONES_DIAS_HABILES:MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY}

# Regla del §4.4 que el prompt pide confirmar: si un COORDINADOR pide permiso, su
# solicitud entra directamente en PENDIENTE_SUPERVISOR en vez de pasar por su propio
# jefe. Se implementa la propuesta del prompt; ponerlo en false la revierte.
app.solicitudes.coordinador-salta-primera-instancia=${COORDINADOR_SALTA_PRIMERA:true}

# ── Subida de archivos ──────────────────────────────────────────────────────
# Límite único para toda la app (no hay override por endpoint). Subido de 10/50MB a
# 300/320MB con la llegada de capacitaciones: un video de inducción no entra en 10MB.
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:300MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:320MB}

# ── Correo ──────────────────────────────────────────────────────────────────
# SMTP estándar con STARTTLS. Apagado por defecto (MAIL_ENABLED=false): en local el
# registro y la recuperación muestran el enlace en pantalla. Para enviar de verdad se
# define una cuenta propia en MAIL_USERNAME / MAIL_PASSWORD del .env (con Gmail, un App
# Password). Las plantillas viven en services/email/EmailService.
#
# La contraseña NUNCA se escribe aquí: viaja por .env, que está en .gitignore
# (hallazgo #1 de docs/DECISIONES.md — en un proyecto de referencia estaba en claro).
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_READ_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
app.mail.from-address=${MAIL_FROM:${spring.mail.username}}
app.mail.from-name=${MAIL_FROM_NAME:School_Plus}
app.mail.reply-to=${MAIL_REPLY_TO:${spring.mail.username}}
app.mail.max-attempts=${MAIL_MAX_ATTEMPTS:3}

# ── Aplicación ──────────────────────────────────────────────────────────────
# Usada en los enlaces de verificación de cuenta y de recuperación de contraseña.
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ── Tablero de tareas ──────────────────────────────────────────────────────
# Cuándo corre TableroRecordatorioJob a avisar de las tarjetas vencidas. Todos los
# días a las 7:00, hora del servidor — antes de que arranque la jornada.
app.tablero.recordatorio-cron=${TABLERO_RECORDATORIO_CRON:0 0 7 * * *}

# ── Almacenamiento de archivos ──────────────────────────────────────────────
# Disco local, dentro de esta carpeta (relativa al directorio desde el que se arranca).
# Nunca se sirve como recurso estático: cada archivo sale por un controlador que antes
# verifica permisos. En la base solo se guardan claves relativas a esta carpeta
# ("videos/<uuid>.mp4"), nunca rutas absolutas ni URLs. Ver LocalDocumentoAlmacenamiento.
app.storage.path=${STORAGE_PATH:./uploads}

# ── Asistencia con QR ───────────────────────────────────────────────────────
# Firma los tokens del QR y los códigos de 6 dígitos. Si se deja vacía, se genera una
# clave aleatoria en cada arranque (y los QR emitidos antes dejan de valer).
app.asistencia.token-key=${ASISTENCIA_TOKEN_KEY:}
# Cada cuántos segundos cambian el QR y el código, y cuántas ventanas anteriores se siguen
# aceptando. Con 15 y 1, un QR vale entre 15 y 30 segundos: una foto reenviada no alcanza.
app.asistencia.rotacion-segundos=${ASISTENCIA_ROTACION_SEGUNDOS:15}
app.asistencia.ventanas-de-gracia=${ASISTENCIA_VENTANAS_GRACIA:1}
# Margen para terminar de iniciar sesión o dar permiso de ubicación DESPUÉS de escanear.
app.asistencia.segundos-para-confirmar=${ASISTENCIA_SEGUNDOS_CONFIRMAR:120}
# Minutos de gracia antes de que un registro cuente como TARDE.
app.asistencia.tolerancia-minutos=${ASISTENCIA_TOLERANCIA_MINUTOS:10}
# A las cuántas horas el sistema cierra una sesión que quedó abierta, y cada cuánto revisa.
app.asistencia.duracion-maxima-horas=${ASISTENCIA_DURACION_MAXIMA_HORAS:4}
app.asistencia.cierre-automatico-cron=${ASISTENCIA_CIERRE_CRON:0 */10 * * * *}
# Validación por ubicación (opcional). Con habilitada=true hay que dar coordenadas reales.
app.asistencia.geo.habilitada=${ASISTENCIA_GEO_HABILITADA:false}
app.asistencia.geo.latitud=${ASISTENCIA_GEO_LATITUD:0}
app.asistencia.geo.longitud=${ASISTENCIA_GEO_LONGITUD:0}
app.asistencia.geo.radio-metros=${ASISTENCIA_GEO_RADIO_METROS:300}

# Detrás de un túnel HTTPS (ngrok, cloudflared) o de un proxy: "framework" hace que la
# aplicación respete X-Forwarded-* y vea el esquema y la IP reales. En local, "none".
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# ── Observabilidad ──────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Sigue apagado aun teniendo ya cuenta de envío, y ahora por otro motivo: el indicador
# ABRE UNA SESIÓN SMTP en cada consulta de salud, y el healthcheck del compose pregunta
# cada 15 s. Serían ~5.700 autenticaciones diarias contra Gmail con la misma cuenta que
# usan otros sistemas: la vía rápida a que Google bloquee el App Password.
management.health.mail.enabled=false
logging.pattern.level=%5p [${spring.application.name},%X{correlationId:-}]
