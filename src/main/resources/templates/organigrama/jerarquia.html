<!DOCTYPE html>
<!-- Quién es jefe de quién, de solo lectura. Árbol calculado por
     OrganigramaService.arbolOrganizacional() a partir de usuario.coordinador_id (la
     fuente autoritativa, no jefe_cargo). Ven esta pantalla ADMIN, SUPERVISOR y
     COORDINADOR — para editarla hay que ir a /talento-humano/organigrama. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina('Jerarquía', ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700">Organigrama</span>
        <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]">Jerarquía</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
        <p class="mt-5 max-w-[62ch] text-[15px] leading-[1.6] text-neutral-700">
            Quién reporta a quién, de arriba hacia abajo. Es de solo lectura: para cambiar
            un jefe, andá a Organigrama en Talento Humano.
        </p>
    </section>

    <section th:if="${#lists.isEmpty(arbol)}">
        <div class="border-l-[3px] border-neutral-400 bg-neutral-100 px-5 py-4 text-[14px] text-neutral-700">
            Todavía nadie tiene un jefe directo asignado.
        </div>
    </section>

    <section th:if="${not #lists.isEmpty(arbol)}">
        <div class="mb-4 flex flex-wrap items-center gap-3">
            <div class="flex gap-2" role="group" aria-label="Cómo ver el organigrama">
                <button type="button" data-organigrama-modo="lista"
                        class="btn btn-primary px-3 py-1.5 text-[12px] uppercase tracking-[0.06em]">
                    Lista
                </button>
                <button type="button" data-organigrama-modo="grafico"
                        class="btn btn-secondary px-3 py-1.5 text-[12px] uppercase tracking-[0.06em]">
                    Gráfico
                </button>
            </div>
            <div class="ml-auto hidden gap-2" data-organigrama-zoom>
                <button type="button" data-organigrama-alejar
                        class="btn btn-secondary h-8 w-8 p-0 text-[14px]" aria-label="Alejar">−</button>
                <button type="button" data-organigrama-acercar
                        class="btn btn-secondary h-8 w-8 p-0 text-[14px]" aria-label="Acercar">+</button>
            </div>
        </div>

        <div data-organigrama-vista-lista class="card p-6">
            <ul class="m-0 list-none p-0" th:replace="~{::nodos(${arbol})}"></ul>
        </div>

        <div data-organigrama-vista-grafico class="card hidden organigrama-grafico-envoltorio">
            <div th:replace="~{::nodosGrafico(${arbol})}"></div>
        </div>
    </section>

</th:block>

<!-- Fragmento recursivo (vista lista): se llama a sí mismo por cada nivel de subordinados. -->
<ul th:fragment="nodos(items)" class="m-0 list-none space-y-3 p-0">
    <li th:each="n : ${items}" class="border-l-2 border-divider pl-4">
        <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1">
            <span class="font-heading text-[15px]" th:text="${n.persona.nombre}">Nombre</span>
            <span th:if="${n.persona.cargo != null}" class="tag tag-outline uppercase tracking-[0.06em]"
                  th:text="${n.persona.cargo.nombre}">Cargo</span>
            <span th:if="${not #lists.isEmpty(n.subordinados)}" class="text-[12px] text-neutral-600"
                  th:text="|${#lists.size(n.subordinados)} a cargo|">2 a cargo</span>
        </div>
        <ul th:if="${not #lists.isEmpty(n.subordinados)}" class="mt-3" th:replace="~{::nodos(${n.subordinados})}"></ul>
    </li>
</ul>

<!-- Fragmento recursivo (vista gráfico): mismo dato ${arbol}, otra forma.
     La raíz es su propio fragmento (con la clase que activa el flexbox y engancha
     el zoom) y llama a nodosGraficoRama para los niveles de abajo, que son <ul>
     sin clase — el CSS (.organigrama-grafico ul) ya les da flex por descendencia,
     y así ".organigrama-grafico > li" (que apaga la línea que no tiene de dónde
     colgar) solo alcanza al nivel más alto, no a cada nivel anidado. -->
<ul th:fragment="nodosGrafico(items)" class="organigrama-grafico" data-organigrama-escalable>
    <li th:each="n : ${items}">
        <div class="organigrama-nodo" th:attr="data-tiene-hijos=${not #lists.isEmpty(n.subordinados)}">
            <span class="font-heading text-[13px]" th:text="${n.persona.nombre}">Nombre</span>
            <span th:if="${n.persona.cargo != null}" class="text-[11px] text-neutral-600" th:text="${n.persona.cargo.nombre}">Cargo</span>
        </div>
        <ul th:if="${not #lists.isEmpty(n.subordinados)}" th:replace="~{::nodosGraficoRama(${n.subordinados})}"></ul>
    </li>
</ul>

<ul th:fragment="nodosGraficoRama(items)">
    <li th:each="n : ${items}">
        <div class="organigrama-nodo" th:attr="data-tiene-hijos=${not #lists.isEmpty(n.subordinados)}">
            <span class="font-heading text-[13px]" th:text="${n.persona.nombre}">Nombre</span>
            <span th:if="${n.persona.cargo != null}" class="text-[11px] text-neutral-600" th:text="${n.persona.cargo.nombre}">Cargo</span>
        </div>
        <ul th:if="${not #lists.isEmpty(n.subordinados)}" th:replace="~{::nodosGraficoRama(${n.subordinados})}"></ul>
    </li>
</ul>
</body>
</html>
