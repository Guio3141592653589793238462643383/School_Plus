<!DOCTYPE html>
<!-- Un curso: video primero, quiz después — el servidor exige haber visto el video antes de aceptar el quiz. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina(${detalle.curso.titulo}, ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700"
              th:text="${detalle.curso.tipo.name() == 'INDUCCION'} ? 'Inducción' : 'Capacitación'">Capacitación</span>
        <h1 class="m-0 mt-3 text-[32px] leading-[1.1] tracking-[-0.02em]" th:text="${detalle.curso.titulo}">Título</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
        <p class="mt-5 max-w-[70ch] text-[15px] leading-[1.6] text-neutral-700" th:text="${detalle.curso.descripcion}">—</p>
    </section>

    <section th:if="${detalle.inscripcion != null and detalle.inscripcion.quizAprobado}">
        <div class="border-l-[3px] border-accent bg-accent-100 px-5 py-4 text-[14px] text-accent-800">
            Ya aprobaste este curso. Mejor nota: <strong th:text="${detalle.inscripcion.mejorNota}">100</strong>.
        </div>
    </section>

    <section class="card p-6">
        <!-- muted a propósito: el navegador bloquea el autoplay con sonido, y acá nunca hace autoplay. -->
        <video data-curso-video controls preload="metadata" class="w-full rounded-md bg-ink"
               th:src="@{'/mi-espacio/capacitaciones/' + ${detalle.curso.id} + '/video'}">
            Tu navegador no soporta video HTML5.
        </video>

        <form data-form-video-visto class="hidden"
              th:action="@{'/mi-espacio/capacitaciones/' + ${detalle.curso.id} + '/video-visto'}" method="post"></form>

        <p data-video-completado
           th:classappend="${detalle.inscripcion != null and detalle.inscripcion.videoCompletadoEn != null} ? '' : 'hidden'"
           class="m-0 mt-3 text-[13px] text-neutral-700">
            ✓ Video visto.
        </p>
    </section>

    <section th:if="${not #lists.isEmpty(detalle.preguntas)}" class="card-strong p-6">
        <h2 class="m-0 mb-4 text-[22px]">Quiz</h2>

        <form th:action="@{'/mi-espacio/capacitaciones/' + ${detalle.curso.id} + '/quiz'}" method="post"
              class="flex flex-col gap-6">
            <fieldset th:each="pregunta : ${detalle.preguntas}" class="flex flex-col gap-2 border-0 p-0 m-0">
                <legend class="mb-1 text-[14px] font-semibold text-ink" th:text="${pregunta.enunciado}">Pregunta</legend>
                <label th:each="opcion : ${pregunta.opciones}"
                       class="flex items-center gap-2 text-[14px] text-neutral-700">
                    <input type="radio" th:name="'respuesta-' + ${pregunta.id}" th:value="${opcion.id}" required>
                    <span th:text="${opcion.texto}">Opción</span>
                </label>
            </fieldset>

            <button type="submit" data-ir-al-quiz
                    th:disabled="${detalle.inscripcion == null or detalle.inscripcion.videoCompletadoEn == null}"
                    class="btn btn-primary self-start px-[18px] py-3 text-[13px] uppercase tracking-[0.06em] disabled:opacity-40">
                Enviar respuestas
            </button>
            <p th:if="${detalle.inscripcion == null or detalle.inscripcion.videoCompletadoEn == null}"
               class="m-0 text-[13px] text-neutral-600">
                Termina de ver el video para habilitar el quiz.
            </p>
        </form>
    </section>

</th:block>
</body>
</html>
