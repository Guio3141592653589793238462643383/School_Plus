<!DOCTYPE html>
<!-- Catálogo de capacitaciones: carrusel de cursos disponibles + la inducción fija arriba. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina('Capacitaciones', ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700">Capacitaciones</span>
        <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]">Capacitaciones</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
    </section>

    <!-- La inducción no es un slide más del carrusel: es obligatoria, va fija. -->
    <section th:if="${induccion != null}">
        <article class="card-strong flex flex-wrap items-center justify-between gap-4 border-l-[3px] border-accent p-6">
            <div>
                <span class="card-kicker">Inducción obligatoria</span>
                <h2 class="m-0 mt-1 text-[22px]" th:text="${induccion.titulo}">Inducción</h2>
                <p class="m-0 mt-1 text-[14px] text-neutral-700" th:text="${induccion.descripcion}">—</p>
            </div>
            <a th:href="@{'/mi-espacio/capacitaciones/' + ${induccion.id}}"
               class="btn btn-primary shrink-0 px-[18px] py-3 text-[13px] uppercase tracking-[0.06em]">
                Empezar
            </a>
        </article>
    </section>

    <section th:if="${not #lists.isEmpty(cursos)}" data-catalogo>
        <div class="mb-5 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <h2 class="m-0 text-[25px]">Disponibles</h2>
            <input type="search" data-catalogo-buscador placeholder="Buscar cursos..."
                   aria-label="Buscar cursos" class="input-linea w-full sm:w-[320px]">
        </div>

        <div class="mb-6 flex flex-wrap gap-2">
            <button type="button" data-catalogo-filtro
                    class="btn btn-primary px-4 py-2 text-[12px] uppercase tracking-[0.06em]">Todos</button>
            <button type="button" data-catalogo-filtro data-campo="obligatorio" data-valor="true"
                    class="btn btn-secondary px-4 py-2 text-[12px] uppercase tracking-[0.06em]">Obligatorios</button>
            <button type="button" data-catalogo-filtro data-campo="completado" data-valor="true"
                    class="btn btn-secondary px-4 py-2 text-[12px] uppercase tracking-[0.06em]">Completados</button>
            <button type="button" data-catalogo-filtro data-campo="completado" data-valor="false"
                    class="btn btn-secondary px-4 py-2 text-[12px] uppercase tracking-[0.06em]">Pendientes</button>
        </div>

        <div data-catalogo-lista class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <article th:each="curso : ${cursos}" data-catalogo-tarjeta
                     th:with="insc=${inscripcionPorCurso.get(curso.id)}, completado=${insc != null and insc.completadoEn != null}"
                     th:attr="data-titulo=${#strings.toLowerCase(curso.titulo + ' ' + (curso.descripcion != null ? curso.descripcion : ''))},
                              data-obligatorio=${curso.obligatorio},
                              data-completado=${completado}"
                     class="card flex flex-col overflow-hidden p-0">
                <a th:href="@{'/mi-espacio/capacitaciones/' + ${curso.id}}" class="block no-underline hover:no-underline">
                    <div class="aspect-video w-full overflow-hidden bg-accent-100">
                        <img th:if="${curso.miniaturaClave != null}"
                             th:src="@{'/mi-espacio/capacitaciones/' + ${curso.id} + '/miniatura'}"
                             alt="" class="h-full w-full object-cover">
                        <div th:if="${curso.miniaturaClave == null}"
                             class="grid h-full w-full place-items-center text-[13px] uppercase tracking-[0.08em] text-accent-700">
                            Capacitación
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 p-4">
                        <div class="flex flex-wrap items-center gap-2">
                            <span class="card-kicker">Capacitación</span>
                            <span th:if="${curso.obligatorio}" class="tag tag-accent uppercase tracking-[0.06em]">Obligatorio</span>
                            <span th:if="${completado}" class="tag tag-neutral uppercase tracking-[0.06em]">✓ Completado</span>
                        </div>
                        <h3 class="m-0 text-[16px] text-ink" th:text="${curso.titulo}">Título</h3>
                        <p class="m-0 line-clamp-2 text-[13px] text-neutral-600" th:text="${curso.descripcion}">—</p>
                    </div>
                </a>
            </article>
        </div>

        <p data-catalogo-sin-resultados class="hidden text-[14px] text-neutral-700">
            Ningún curso coincide con tu búsqueda o filtro.
        </p>
    </section>

    <section th:if="${#lists.isEmpty(cursos) and induccion == null}">
        <p class="text-[14px] text-neutral-700">Todavía no hay cursos publicados.</p>
    </section>

</th:block>
</body>
</html>
