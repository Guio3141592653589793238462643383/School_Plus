<!DOCTYPE html>
<!-- Administración de cursos: alta, publicar/despublicar y el reporte consolidado. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina('Cursos', ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700">Talento Humano</span>
        <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]">Cursos</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
    </section>

    <section>
        <div class="mb-4 flex flex-wrap items-baseline justify-between gap-4">
            <h2 class="m-0 text-[25px]">Catálogo</h2>
            <div class="flex flex-wrap gap-3">
                <a th:href="@{/talento-humano/capacitaciones/reporte.xlsx}"
                   class="btn btn-secondary px-[18px] py-3 text-[13px] uppercase tracking-[0.06em]">
                    Descargar reporte
                </a>
                <a th:href="@{/talento-humano/capacitaciones/nuevo}"
                   class="btn btn-primary px-[18px] py-3 text-[13px] uppercase tracking-[0.06em]">
                    Nuevo curso
                </a>
            </div>
        </div>

        <div class="card overflow-x-auto p-0" th:if="${not #lists.isEmpty(cursos)}">
            <table class="table">
                <thead>
                <tr>
                    <th class="pl-5">Título</th>
                    <th>Tipo</th>
                    <th>Obligatorio</th>
                    <th>Estado</th>
                    <th class="pr-5">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="curso : ${cursos}">
                    <td class="pl-5" th:text="${curso.titulo}">Título</td>
                    <td th:text="${curso.tipo.name() == 'INDUCCION'} ? 'Inducción' : 'Capacitación'">Tipo</td>
                    <td th:text="${curso.obligatorio} ? 'Sí' : 'No'">No</td>
                    <td>
                        <span class="tag uppercase tracking-[0.06em]"
                              th:classappend="${curso.publicado} ? 'tag-neutral' : 'tag-outline'"
                              th:text="${curso.publicado} ? 'Publicado' : 'Borrador'">Estado</span>
                    </td>
                    <td class="pr-5">
                        <div class="flex flex-wrap gap-2">
                            <a th:href="@{'/talento-humano/capacitaciones/' + ${curso.id} + '/editar'}"
                               class="btn btn-secondary px-3 py-1.5 text-[12px] uppercase tracking-[0.06em]">
                                Editar
                            </a>
                            <form th:action="@{'/talento-humano/capacitaciones/' + ${curso.id} + '/publicar'}" method="post" class="m-0">
                                <input type="hidden" name="publicado" th:value="${not curso.publicado}">
                                <button type="submit" class="btn btn-secondary px-3 py-1.5 text-[12px] uppercase tracking-[0.06em]">
                                    <span th:text="${curso.publicado} ? 'Despublicar' : 'Publicar'">Publicar</span>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <p th:if="${#lists.isEmpty(cursos)}" class="text-[14px] text-neutral-700">
            Todavía no has creado ningún curso.
        </p>
    </section>

</th:block>
</body>
</html>
