<!DOCTYPE html>
<!--
  Auto-registro de cuenta.
  Flujo portado de un proyecto de referencia (services/auth/RegisterService.java) — el único
  de los tres repos donde sigue vivo. Los catálogos de sede y cargo salen de la base
  de datos (en el original eran Set.of() inmutables en ValidationService).
  Estética: la misma del login (los prototipos de diseño (login)).
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/auth-layout :: pagina('Crea tu cuenta', ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <span class="mb-3.5 text-[12px] uppercase tracking-[0.14em] text-[var(--color-accent-700)]">Registro</span>
    <h2 class="m-0 mb-2 text-[34px] tracking-[-0.02em]">Crea tu cuenta</h2>
    <p class="m-0 mb-8 text-[15px] text-[var(--color-neutral-700)]">
        Verificamos tu correo antes de activarla. El enlace vence en 24 horas.
    </p>

    <div th:if="${not #lists.isEmpty(errores)}" class="aviso mb-6" role="alert">
        <ul>
            <li th:each="error : ${errores}" th:text="${error}">Error</li>
        </ul>
    </div>

    <form th:action="@{/registro}" th:object="${registroForm}" method="post"
          class="flex flex-col gap-[22px]" data-formulario-auth>

        <div class="flex flex-col gap-2">
            <label for="nombre" class="etiqueta-campo">Nombre completo</label>
            <input id="nombre" th:field="*{nombre}" type="text" required maxlength="110"
                   placeholder="Nombre y apellido" autocomplete="name" class="input-linea">
        </div>

        <div class="flex flex-col gap-2">
            <label for="email" class="etiqueta-campo">Correo corporativo</label>
            <input id="email" th:field="*{email}" type="email" required maxlength="180"
                   placeholder="nombre.apellido@schoolplus.example" autocomplete="username" class="input-linea">
        </div>

        <div class="grid grid-cols-1 gap-[22px] sm:grid-cols-2">
            <div class="flex flex-col gap-2">
                <label for="cedula" class="etiqueta-campo">Cédula</label>
                <input id="cedula" th:field="*{cedula}" type="text" required inputmode="numeric"
                       maxlength="12" placeholder="1000000000" class="input-linea">
            </div>
            <div class="flex flex-col gap-2">
                <label for="telefono" class="etiqueta-campo">Teléfono</label>
                <input id="telefono" th:field="*{telefono}" type="tel" required inputmode="numeric"
                       maxlength="15" placeholder="3000000000" autocomplete="tel" class="input-linea">
            </div>
        </div>

        <div class="grid grid-cols-1 gap-[22px] sm:grid-cols-2">
            <div class="flex flex-col gap-2">
                <label for="sedeId" class="etiqueta-campo">Sede</label>
                <select id="sedeId" th:field="*{sedeId}" required class="input-linea">
                    <option value="">Selecciona…</option>
                    <option th:each="sede : ${sedes}" th:value="${sede.id}" th:text="${sede.nombre}">Sede</option>
                </select>
            </div>
            <div class="flex flex-col gap-2">
                <label for="cargoId" class="etiqueta-campo">Cargo</label>
                <select id="cargoId" th:field="*{cargoId}" required class="input-linea">
                    <option value="">Selecciona…</option>
                    <option th:each="cargo : ${cargos}" th:value="${cargo.id}" th:text="${cargo.nombre}">Cargo</option>
                </select>
            </div>
        </div>

        <div class="flex flex-col gap-2">
            <div class="flex items-baseline justify-between gap-3">
                <label for="password" class="etiqueta-campo">Contraseña</label>
                <button type="button"
                        class="cursor-pointer border-0 bg-transparent p-0 font-[var(--font-body)] text-[11px] uppercase tracking-[0.1em] text-[var(--color-accent-700)] hover:text-[var(--color-accent)]"
                        data-revelar="password" aria-controls="password">Mostrar</button>
            </div>
            <input id="password" th:field="*{password}" type="password" required
                   placeholder="Mínimo 10 caracteres" autocomplete="new-password" class="input-linea">
            <span class="text-[12px] text-[var(--color-neutral-600)]"
                  th:text="|Mínimo ${longitudMinimaPassword} caracteres, con letras y números. No uses una contraseña común.|">
                Mínimo 10 caracteres.
            </span>
        </div>

        <div class="flex flex-col gap-2">
            <label for="confirmPassword" class="etiqueta-campo">Repite la contraseña</label>
            <input id="confirmPassword" th:field="*{confirmPassword}" type="password" required
                   placeholder="••••••••" autocomplete="new-password" class="input-linea">
        </div>

        <button type="submit"
                class="btn btn-primary flex w-full items-center gap-2.5 !justify-start px-[18px] py-4 text-[14px] uppercase tracking-[0.06em]"
                data-etiqueta-envio="Enviando…">
            <span class="flex-1 text-left">Crear cuenta</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="square" aria-hidden="true">
                <path d="M5 12h14M13 6l6 6-6 6"></path>
            </svg>
        </button>
    </form>

    <p class="mt-8 text-[13px] text-[var(--color-neutral-700)]">
        ¿Ya tienes cuenta? <a th:href="@{/}">Inicia sesión</a>
    </p>

</th:block>
</body>
</html>
