<!DOCTYPE html>
<!--
  Bandeja de aprobación. La misma plantilla sirve para las dos instancias: lo único que
  cambia es a dónde apuntan los botones, que llega en ${rutaBase}. Duplicarla habría
  significado arreglar cada cosa dos veces.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina(${titulo}, ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700" th:text="${antetitulo}">Bandeja</span>
        <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]" th:text="${titulo}">Bandeja</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
        <p class="mt-5 max-w-[70ch] text-[15px] leading-[1.6] text-neutral-700" th:text="${descripcion}">
            Descripción.
        </p>
    </section>

    <section th:if="${#lists.isEmpty(solicitudes)}">
        <div class="border-l-[3px] border-neutral-400 bg-neutral-100 px-5 py-4 text-[14px] text-neutral-700">
            No tienes nada pendiente por resolver.
        </div>
    </section>

    <section class="flex flex-col gap-5">
        <!-- Acento izquierdo: distingue esta cola de acción (aprobar/denegar) de las
             tarjetas pasivas del portal, que usan el mismo .card sin el borde. -->
        <article th:each="item : ${solicitudes}" class="card border-l-[3px] border-accent p-6">

            <div class="flex flex-wrap items-baseline justify-between gap-3">
                <div>
                    <span class="card-kicker" th:text="${item.solicitud.tipo.nombre}">Tipo</span>
                    <h2 class="m-0 mt-1 text-[22px]" th:text="${item.solicitud.solicitante.nombre}">Nombre</h2>
                </div>
                <span class="tag tag-outline uppercase tracking-[0.06em]"
                      th:text="${#numbers.formatDecimal(item.solicitud.diasHabiles, 1, 2)} + ' días hábiles'">5 días</span>
            </div>

            <dl class="mt-4 grid grid-cols-2 gap-x-6 gap-y-2 text-[14px] sm:grid-cols-4">
                <div>
                    <dt class="text-[11px] uppercase tracking-[0.1em] text-neutral-600">Desde</dt>
                    <dd class="m-0" th:text="${#temporals.format(item.solicitud.fechaInicio, 'dd/MM/yyyy')}">—</dd>
                </div>
                <div>
                    <dt class="text-[11px] uppercase tracking-[0.1em] text-neutral-600">Hasta</dt>
                    <dd class="m-0" th:text="${#temporals.format(item.solicitud.fechaFin, 'dd/MM/yyyy')}">—</dd>
                </div>
                <div class="col-span-2">
                    <dt class="text-[11px] uppercase tracking-[0.1em] text-neutral-600">Motivo</dt>
                    <dd class="m-0 text-neutral-700" th:text="${item.solicitud.motivo ?: '—'}">—</dd>
                </div>
            </dl>

            <p th:if="${item.solicitud.archivoClave != null}" class="m-0 mt-3 text-[13px]">
                <a th:href="@{'/mi-espacio/solicitudes/' + ${item.solicitud.id} + '/soporte'}" target="_blank">
                    Ver adjunto
                </a>
            </p>

            <!-- Cruces con el equipo: ADVERTENCIA, no bloqueo (§4.5) -->
            <div th:if="${not #lists.isEmpty(item.cruces)}"
                 class="mt-4 border-l-[3px] border-accent bg-accent-100 px-4 py-3 text-[13px] leading-[1.6] text-accent-800">
                <strong>Se cruza con el equipo.</strong> No impide aprobar; decides tú.
                <ul class="mt-1 list-square pl-5">
                    <li th:each="cruce : ${item.cruces}"
                        th:text="|${cruce.solicitante.nombre}: ${#temporals.format(cruce.fechaInicio, 'dd/MM')} a ${#temporals.format(cruce.fechaFin, 'dd/MM')} (${cruce.tipo.nombre})|">
                        cruce
                    </li>
                </ul>
            </div>

            <div class="mt-6 flex flex-wrap items-end gap-3">
                <form th:action="@{${rutaBase} + '/' + ${item.solicitud.id} + '/aprobar'}" method="post" class="m-0">
                    <button type="submit"
                            class="btn btn-primary px-[18px] py-3 text-[13px] uppercase tracking-[0.06em]">
                        Aprobar
                    </button>
                </form>

                <form th:action="@{${rutaBase} + '/' + ${item.solicitud.id} + '/rechazar'}" method="post"
                      class="m-0 flex flex-wrap items-end gap-3">
                    <div class="flex flex-col gap-1">
                        <label th:for="'motivo-' + ${item.solicitud.id}" class="etiqueta-campo">Motivo de la negativa</label>
                        <input th:id="'motivo-' + ${item.solicitud.id}" name="motivo" type="text" required
                               maxlength="500" class="input-linea w-[280px]" placeholder="Obligatorio">
                    </div>
                    <button type="submit"
                            class="btn btn-secondary px-[18px] py-3 text-[13px] uppercase tracking-[0.06em]">
                        Denegar
                    </button>
                </form>
            </div>
        </article>
    </section>

</th:block>
</body>
</html>
