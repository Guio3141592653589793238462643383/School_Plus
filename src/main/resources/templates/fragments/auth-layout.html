<!DOCTYPE html>
<!--
  Marco compartido por TODAS las vistas de autenticación: login, registro,
  recuperación y restablecimiento de contraseña.

  Origen: los prototipos de diseño (login/Login.dc.html) — se porta la composición
  completa (panel izquierdo con la marca y el titular, columna derecha con el
  formulario, tira superior y pie). Cambios respecto al prototipo:

    · Las tres cifras del panel salen de la base de datos, no son texto fijo.
      El prototipo traía "4.820 / 36 / v4.2" como marcador de posición.
    · Nada de style="" en línea ni de <script> embebido: la CSP declarada en
      SecurityConfig prohíbe ambos. El color del panel pasa a una clase Tailwind
      y el JS vive en /js/auth.js.
    · Rejilla de una sola columna por debajo de lg; el panel se oculta.
-->
<html th:fragment="pagina(titulo, contenido)" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${titulo} · School_Plus|">School_Plus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,800;1,300&display=swap">
    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body class="m-0 min-h-screen bg-[var(--color-bg)] font-[var(--font-body)] text-[var(--color-text)] antialiased">

<div class="grid min-h-screen grid-cols-1 lg:grid-cols-[1.05fr_1fr]">

    <!-- ── Panel de marca ─────────────────────────────────────────────────── -->
    <aside class="relative hidden flex-col justify-between overflow-hidden border-r border-[var(--color-divider)] bg-[var(--color-accent-200)] px-14 pt-14 pb-10 lg:flex">
        <div class="panel-marca-rejilla pointer-events-none absolute inset-0"></div>

        <div class="relative flex items-baseline gap-3">
            <div class="h-3.5 w-3.5 shrink-0 bg-[var(--color-accent)]"></div>
            <span class="font-[var(--font-heading)] text-[15px] font-extrabold uppercase tracking-[0.16em] text-[var(--color-accent-800)]">School_Plus</span>
        </div>

        <div class="relative flex max-w-[460px] flex-col gap-7">
            <h1 class="m-0 text-[68px] leading-[0.98] tracking-[-0.03em] text-balance text-[var(--color-accent-900)]">
                Tu colegio,<br><em class="font-light italic">en un solo lugar</em>
            </h1>
            <div class="h-0.5 w-24 bg-[var(--color-accent-700)]"></div>
            <p class="m-0 max-w-[40ch] text-[17px] leading-[1.55] text-[var(--color-accent-800)]">
                Asistencia con QR, cursos, documentos y comunicación entre docentes y
                estudiantes.
            </p>
        </div>

        <div class="relative grid grid-cols-3 gap-4 border-t border-[var(--color-accent-700)] pt-4">
            <div class="flex flex-col gap-0.5">
                <span class="font-[var(--font-heading)] text-[22px] font-extrabold text-[var(--color-accent-900)]"
                      th:text="${#numbers.formatInteger(portadaColaboradores, 1, 'POINT')}">0</span>
                <span class="text-[11px] uppercase tracking-[0.1em] text-[var(--color-accent-700)]">Usuarios</span>
            </div>
            <div class="flex flex-col gap-0.5">
                <span class="font-[var(--font-heading)] text-[22px] font-extrabold text-[var(--color-accent-900)]"
                      th:text="${portadaSedes}">0</span>
                <span class="text-[11px] uppercase tracking-[0.1em] text-[var(--color-accent-700)]">Sedes</span>
            </div>
            <div class="flex flex-col gap-0.5">
                <span class="font-[var(--font-heading)] text-[22px] font-extrabold text-[var(--color-accent-900)]"
                      th:text="'v' + ${portadaVersion}">v0</span>
                <span class="text-[11px] uppercase tracking-[0.1em] text-[var(--color-accent-700)]">Plataforma</span>
            </div>
        </div>
    </aside>

    <!-- ── Columna del formulario ─────────────────────────────────────────── -->
    <main class="flex flex-col gap-10 px-6 py-10 sm:px-10 lg:pl-14 lg:pr-16">

        <div class="flex items-center justify-between text-[12px] uppercase tracking-[0.08em] text-[var(--color-neutral-600)]">
            <span>Plataforma escolar</span>
            <a th:href="@{/}" class="lg:hidden">School_Plus</a>
        </div>

        <div class="flex w-full max-w-[460px] flex-1 flex-col justify-center">
            <th:block th:replace="${contenido}"/>
        </div>

        <div class="flex flex-col gap-2 border-t border-[var(--color-divider)] pt-4 text-[12px] text-[var(--color-neutral-600)] sm:flex-row sm:items-center sm:justify-between sm:gap-4">
            <span>¿Sin acceso? Escribe a soporte@schoolplus.example</span>
            <span class="flex gap-[18px]">
                <a th:href="@{/}">Inicio</a>
                <a th:href="@{/recuperar}">Recuperar contraseña</a>
            </span>
        </div>
    </main>
</div>

<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
