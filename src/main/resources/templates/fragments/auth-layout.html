<!DOCTYPE html>
<!--
  Marco compartido por TODAS las vistas de autenticación: login, registro,
  recuperación y restablecimiento de contraseña.

  Una tarjeta centrada en la pantalla, sin panel lateral: la marca, el formulario y
  debajo los enlaces de ayuda.

  Nada de style="" en línea ni de <script> embebido: la CSP declarada en
  SecurityConfig prohíbe ambos. El JS vive en /js/auth.js.
-->
<html th:fragment="pagina(titulo, contenido)" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|${titulo} · School_Plus|">School_Plus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,800;1,300&display=swap">
    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body class="m-0 min-h-screen bg-[var(--color-bg)] font-[var(--font-body)] text-[var(--color-text)] antialiased">

<main class="flex min-h-screen flex-col items-center justify-center px-4 py-10">
    <div class="w-full max-w-[480px]">

        <a th:href="@{/}" class="mb-6 flex items-center justify-center gap-3 no-underline hover:no-underline">
            <span class="h-3.5 w-3.5 shrink-0 bg-[var(--color-accent)]"></span>
            <span class="font-[var(--font-heading)] text-[15px] font-extrabold uppercase tracking-[0.16em] text-[var(--color-accent-800)]">School_Plus</span>
        </a>

        <div class="card-strong flex flex-col px-6 py-8 sm:px-10 sm:py-10">
            <th:block th:replace="${contenido}"/>
        </div>

        <div class="mt-6 flex flex-col items-center gap-2 text-center text-[12px] text-[var(--color-neutral-600)]">
            <span>¿Sin acceso? Escribe a soporte@schoolplus.example</span>
            <span class="flex gap-[18px]">
                <a th:href="@{/}">Inicio</a>
                <a th:href="@{/recuperar}">Recuperar contraseña</a>
            </span>
        </div>
    </div>
</main>

<script th:src="@{/js/auth.js}" defer></script>
</body>
</html>
