<!DOCTYPE html>
<!-- Alta de usuario. La contraseña se fija aquí mismo, así la cuenta nace usable. El
     rol no se toca acá: nace USUARIO y se sube aparte, desde la ficha, un acto deliberado. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina('Nuevo usuario', ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700">Administración</span>
        <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]">Nuevo usuario</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
    </section>

    <section class="card-strong max-w-[640px] p-6">
        <form th:action="@{/rectoria/usuarios}" method="post" class="grid grid-cols-1 gap-4 sm:grid-cols-2">
            <div class="sm:col-span-2">
                <label class="etiqueta-campo" for="nombre">Nombre completo</label>
                <input id="nombre" name="nombre" type="text" required maxlength="110" class="input">
            </div>
            <div class="sm:col-span-2">
                <label class="etiqueta-campo" for="email">Correo</label>
                <input id="email" name="email" type="email" required maxlength="180" class="input">
            </div>
            <div>
                <label class="etiqueta-campo" for="cedula">Cédula</label>
                <input id="cedula" name="cedula" type="text" required maxlength="12" class="input">
            </div>
            <div>
                <label class="etiqueta-campo" for="telefono">Teléfono</label>
                <input id="telefono" name="telefono" type="text" required maxlength="15" class="input">
            </div>
            <div class="sm:col-span-2">
                <label class="etiqueta-campo" for="fechaNacimiento">Fecha de nacimiento</label>
                <input id="fechaNacimiento" name="fechaNacimiento" type="date" class="input">
            </div>

            <div class="sm:col-span-2 mt-2 border-t border-neutral-200 pt-4">
                <span class="card-kicker">Contraseña de acceso</span>
                <p class="m-0 mt-1 text-[12px] text-neutral-600"
                   th:text="|Mínimo ${longitudMinimaPassword} caracteres, con letras y números, sin el nombre ni el correo. Dásela a la persona en privado.|">
                    Mínimo 10 caracteres.
                </p>
            </div>
            <div>
                <label class="etiqueta-campo" for="password">Contraseña</label>
                <input id="password" name="password" type="password" required autocomplete="new-password"
                       th:attr="minlength=${longitudMinimaPassword}" class="input">
            </div>
            <div>
                <label class="etiqueta-campo" for="confirmPassword">Repetir contraseña</label>
                <input id="confirmPassword" name="confirmPassword" type="password" required
                       autocomplete="new-password" class="input">
            </div>

            <div class="sm:col-span-2 mt-2 flex gap-3">
                <button type="submit" class="btn btn-primary flex-1 py-3 text-[13px] uppercase tracking-[0.06em]">
                    Crear usuario
                </button>
                <a th:href="@{/rectoria/usuarios}"
                   class="btn btn-secondary px-5 py-3 text-[13px] uppercase tracking-[0.06em]">
                    Cancelar
                </a>
            </div>
        </form>
    </section>

</th:block>
</body>
</html>
