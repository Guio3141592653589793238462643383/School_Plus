<!DOCTYPE html>
<!-- Ficha completa de un usuario para rectoría/ADMIN: datos, foto y roles. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina(${usuario.nombre}, ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section class="flex flex-wrap items-end justify-between gap-4">
        <div>
            <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700">Administración</span>
            <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]" th:text="${usuario.nombre}">Nombre</h1>
            <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
        </div>
        <div class="flex items-center gap-3">
            <span class="tag" th:classappend="${usuario.estado.name() == 'ACTIVO'} ? 'tag-success' : 'tag-outline'"
                  th:text="${usuario.estado.name() == 'ACTIVO'} ? 'Activo' : 'Inactivo'">Estado</span>
            <form th:action="@{/rectoria/usuarios/{id}/estado(id=${usuario.id})}" method="post" class="m-0">
                <input type="hidden" name="nuevoEstado"
                       th:value="${usuario.estado.name() == 'ACTIVO'} ? 'INACTIVO' : 'ACTIVO'">
                <button type="submit" class="btn btn-secondary px-4 py-2 text-[12px] uppercase tracking-[0.06em]"
                        th:text="${usuario.estado.name() == 'ACTIVO'} ? 'Desactivar' : 'Activar'">
                    Desactivar
                </button>
            </form>
        </div>
    </section>

    <div class="grid grid-cols-1 gap-8 lg:grid-cols-[280px_1fr]">

        <!-- ══ FOTO ════════════════════════════════════════════════════════ -->
        <section class="card-strong items-center p-6 text-center">
            <span class="card-kicker self-start">Foto de perfil</span>

            <div class="my-4 h-32 w-32 shrink-0 overflow-hidden rounded-full border border-divider shadow-md">
                <img th:if="${tieneFoto}" th:src="@{/rectoria/usuarios/{id}/foto(id=${usuario.id})}"
                     alt="Foto de perfil" class="h-full w-full object-cover">
                <span th:unless="${tieneFoto}"
                      class="grid h-full w-full place-items-center bg-accent text-[28px] font-extrabold text-bg"
                      th:text="${#strings.toUpperCase(#strings.substring(usuario.nombre, 0, 2))}">AL</span>
            </div>

            <form th:action="@{/rectoria/usuarios/{id}/foto(id=${usuario.id})}" method="post"
                  enctype="multipart/form-data" class="flex w-full flex-col gap-3">
                <input name="archivo" type="file" required accept="image/jpeg,image/png,image/webp" class="input">
                <button type="submit" class="btn btn-primary w-full py-2.5 text-[12px] uppercase tracking-[0.06em]">
                    Subir foto
                </button>
            </form>
            <form th:if="${tieneFoto}" th:action="@{/rectoria/usuarios/{id}/foto/eliminar(id=${usuario.id})}"
                  method="post" class="mt-2 w-full">
                <button type="submit" class="btn btn-secondary w-full py-2.5 text-[12px] uppercase tracking-[0.06em]">
                    Eliminar foto
                </button>
            </form>
        </section>

        <!-- ══ DATOS BÁSICOS ═══════════════════════════════════════════════ -->
        <section class="card-strong p-6">
            <span class="card-kicker">Información</span>

            <form th:action="@{/rectoria/usuarios/{id}(id=${usuario.id})}" method="post"
                  class="mt-4 grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div class="sm:col-span-2">
                    <label class="etiqueta-campo" for="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" required maxlength="110" class="input"
                           th:value="${usuario.nombre}">
                </div>
                <div class="sm:col-span-2">
                    <label class="etiqueta-campo" for="email">Correo</label>
                    <input id="email" name="email" type="email" required maxlength="180" class="input"
                           th:value="${usuario.email}">
                </div>
                <div>
                    <label class="etiqueta-campo" for="cedula">Cédula</label>
                    <input id="cedula" name="cedula" type="text" required maxlength="12" class="input"
                           th:value="${usuario.cedula}">
                </div>
                <div>
                    <label class="etiqueta-campo" for="telefono">Teléfono</label>
                    <input id="telefono" name="telefono" type="text" required maxlength="15" class="input"
                           th:value="${usuario.telefono}">
                </div>
                <div class="sm:col-span-2">
                    <label class="etiqueta-campo" for="fechaNacimiento">Fecha de nacimiento</label>
                    <input id="fechaNacimiento" name="fechaNacimiento" type="date" class="input"
                           th:value="${usuario.fechaNacimiento}">
                </div>
                <div class="sm:col-span-2">
                    <button type="submit" class="btn btn-primary w-full py-3 text-[13px] uppercase tracking-[0.06em]">
                        Guardar datos
                    </button>
                </div>
            </form>
        </section>
    </div>

    <div class="grid grid-cols-1 gap-8 lg:max-w-[640px]">

        <!-- ══ ROLES ═══════════════════════════════════════════════════════ -->
        <section class="card-strong p-6">
            <span class="card-kicker">Roles</span>
            <form th:action="@{/rectoria/usuarios/{id}/roles(id=${usuario.id})}" method="post"
                  class="mt-4 flex flex-col gap-3">
                <label th:each="r : ${roles}" class="flex items-center gap-2 text-[14px]">
                    <input type="checkbox" name="roles" th:value="${r.codigo}"
                           th:checked="${codigosRolDelUsuario.contains(r.codigo)}">
                    <span th:text="${r.nombre}">Rol</span>
                </label>
                <button type="submit" class="btn btn-primary mt-1 w-full py-2.5 text-[12px] uppercase tracking-[0.06em]">
                    Guardar roles
                </button>
            </form>
        </section>
    </div>

</th:block>
</body>
</html>
