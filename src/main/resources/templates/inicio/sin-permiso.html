<!DOCTYPE html>
<!-- Destino de accessDeniedPage: alguien autenticado pidió una ruta de otro rol. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin permiso · School_Plus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,800;1,300&display=swap">
    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body class="m-0 grid min-h-screen place-items-center bg-[var(--color-bg)] px-6 font-[var(--font-body)] text-[var(--color-text)] antialiased">

<main class="w-full max-w-[560px]">
    <div class="flex items-baseline gap-3">
        <div class="h-3.5 w-3.5 shrink-0 bg-[var(--color-accent)]"></div>
        <span class="font-[var(--font-heading)] text-[15px] font-extrabold uppercase tracking-[0.16em]">School_Plus</span>
    </div>

    <span class="mt-10 block text-[12px] uppercase tracking-[0.14em] text-[var(--color-accent-700)]">Error 403</span>
    <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]">Esa sección no es tuya</h1>
    <div class="mt-6 h-0.5 w-24 bg-[var(--color-accent-700)]"></div>
    <p class="mt-6 text-[15px] leading-[1.6] text-[var(--color-neutral-700)]">
        Tu cuenta (<span th:text="${usuario.email}">correo</span>) no tiene permiso para
        entrar aquí. Si crees que sí debería tenerlo, escribe a la administración.
    </p>

    <div class="mt-8 flex flex-wrap gap-3">
        <a th:href="@{/mi-espacio}"
           class="btn btn-primary px-[18px] py-4 text-[14px] uppercase tracking-[0.06em]">Ir a mi espacio</a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit"
                    class="btn btn-secondary px-[18px] py-4 text-[14px] uppercase tracking-[0.06em]">
                Cerrar sesión
            </button>
        </form>
    </div>
</main>

</body>
</html>
