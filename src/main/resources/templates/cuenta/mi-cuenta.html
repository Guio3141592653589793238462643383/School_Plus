<!DOCTYPE html>
<!-- "Mi cuenta": foto de perfil y datos básicos de la persona que tiene la sesión abierta. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina('Mi cuenta', ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700">Cuenta</span>
        <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]">Mi cuenta</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
    </section>

    <div class="grid grid-cols-1 gap-8 lg:grid-cols-[280px_1fr]">

        <!-- ══ FOTO DE PERFIL ═══════════════════════════════════════════════ -->
        <section class="card-strong items-center p-6 text-center">
            <span class="card-kicker self-start">Foto de perfil</span>

            <div class="my-4 h-32 w-32 shrink-0 overflow-hidden rounded-full border border-divider shadow-md">
                <img th:if="${tieneFoto}" th:src="@{/mi-cuenta/foto}" alt="Tu foto de perfil"
                     class="h-full w-full object-cover">
                <span th:unless="${tieneFoto}"
                      class="grid h-full w-full place-items-center bg-accent text-[28px] font-extrabold text-bg"
                      th:text="${#strings.toUpperCase(#strings.substring(usuario.nombre, 0, 2))}">AL</span>
            </div>

            <form th:action="@{/mi-cuenta/foto}" method="post" enctype="multipart/form-data"
                  class="flex w-full flex-col gap-3">
                <label class="etiqueta-campo self-start" for="archivo-foto">Cambiar foto</label>
                <input id="archivo-foto" name="archivo" type="file" required
                       accept="image/jpeg,image/png,image/webp" class="input">
                <p class="m-0 text-[11px] text-neutral-600">JPEG, PNG o WEBP. Máximo 3 MB.</p>
                <button type="submit" class="btn btn-primary w-full py-3 text-[13px] uppercase tracking-[0.06em]">
                    Subir foto
                </button>
            </form>

            <form th:if="${tieneFoto}" th:action="@{/mi-cuenta/foto/eliminar}" method="post" class="mt-2 w-full">
                <button type="submit" class="btn btn-secondary w-full py-2.5 text-[12px] uppercase tracking-[0.06em]">
                    Eliminar foto
                </button>
            </form>
        </section>

        <!-- ══ DATOS ═══════════════════════════════════════════════════════ -->
        <section class="grid grid-cols-1 gap-5 self-start sm:grid-cols-2">
            <div class="stat stat-highlight">
                <span class="card-kicker">Nombre</span>
                <p class="mt-2 mb-0 font-heading text-[17px]" th:text="${usuario.nombre}">Nombre</p>
            </div>
            <div class="stat">
                <span class="card-kicker">Cuenta</span>
                <p class="mt-2 mb-0 break-all font-heading text-[15px]" th:text="${usuario.email}">correo</p>
            </div>
            <div class="stat">
                <span class="card-kicker">Sede</span>
                <p class="mt-2 mb-0 font-heading text-[17px]" th:text="${usuario.sede}">Sede</p>
            </div>
            <div class="stat">
                <span class="card-kicker">Cargo</span>
                <p class="mt-2 mb-0 font-heading text-[17px]" th:text="${usuario.cargo}">Cargo</p>
            </div>
        </section>
    </div>

</th:block>
</body>
</html>
