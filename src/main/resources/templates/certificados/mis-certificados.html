<!DOCTYPE html>
<!-- Certificado laboral: autoservicio, sin aprobación — se genera al instante. -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina('Certificado laboral', ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700">Certificado laboral</span>
        <h1 class="m-0 mt-3 text-[40px] leading-[1.05] tracking-[-0.03em]">Certificado laboral</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
        <p class="mt-5 max-w-[62ch] text-[15px] leading-[1.6] text-neutral-700">
            Se genera al instante, con los datos que ya tenemos de ti. Cada certificado
            trae un código QR para que un tercero pueda verificarlo.
        </p>
    </section>

    <section>
        <form th:action="@{/mi-espacio/certificado-laboral}" method="post" class="m-0">
            <button type="submit" class="btn btn-primary px-[18px] py-4 text-[14px] uppercase tracking-[0.06em]">
                Generar certificado
            </button>
        </form>
    </section>

    <section class="flex flex-col gap-3">
        <h2 class="m-0 text-[22px]">Historial</h2>
        <article th:each="c : ${certificados}" class="card flex flex-wrap items-center justify-between gap-4 p-5">
            <div>
                <p class="m-0 text-[14px]" th:text="${#temporals.format(c.emitidoEn, 'dd/MM/yyyy HH:mm')}">01/01/2026</p>
                <p class="m-0 mt-1 text-[12px] text-neutral-600" th:text="'Código ' + ${c.codigoVerificacion}">—</p>
            </div>
            <a th:href="@{'/mi-espacio/certificado-laboral/' + ${c.id} + '/descargar'}"
               class="btn btn-secondary px-[18px] py-3 text-[13px] uppercase tracking-[0.06em]">
                Descargar
            </a>
        </article>
        <p th:if="${#lists.isEmpty(certificados)}" class="text-[14px] text-neutral-700">
            Todavía no has generado ningún certificado.
        </p>
    </section>

</th:block>
</body>
</html>
