<!DOCTYPE html>
<!-- Historial de un colaborador + formulario para registrar uno nuevo (coordinador o Talento Humano). -->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app-layout :: pagina('Reconocimientos', ~{::seccion})}">
<body>
<th:block th:fragment="seccion">

    <section>
        <span class="text-[12px] uppercase tracking-[0.14em] text-accent-700">Mi equipo</span>
        <h1 class="m-0 mt-3 text-[32px] leading-[1.1] tracking-[-0.02em]"
            th:text="'Reconocimientos de ' + ${colaborador.nombre}">Reconocimientos</h1>
        <div class="mt-5 h-0.5 w-24 bg-accent-700"></div>
    </section>

    <section th:if="${@capacidades.puede('RECONOCIMIENTO_CREAR')}" class="card-strong max-w-[620px] p-6">
        <h2 class="m-0 mb-4 text-[18px]">Registrar nuevo</h2>
        <form th:action="@{'/personas/' + ${colaborador.id} + '/reconocimientos'}" method="post"
              enctype="multipart/form-data" class="flex flex-col gap-6">

            <div class="flex flex-col gap-2">
                <label for="tipo" class="etiqueta-campo">Tipo</label>
                <select id="tipo" name="tipo" required class="input-linea">
                    <option th:each="t : ${tipos}" th:value="${t}"
                            th:text="${t.name() == 'RECONOCIMIENTO'} ? 'Reconocimiento' : 'Llamado de atención'">Tipo</option>
                </select>
            </div>

            <div class="flex flex-col gap-2">
                <label for="categoria" class="etiqueta-campo">Categoría</label>
                <input id="categoria" name="categoria" type="text" maxlength="100" class="input-linea"
                       placeholder="Opcional">
            </div>

            <div class="flex flex-col gap-2">
                <label for="titulo" class="etiqueta-campo">Título</label>
                <input id="titulo" name="titulo" type="text" required maxlength="200" class="input-linea">
            </div>

            <div class="flex flex-col gap-2">
                <label for="descripcion" class="etiqueta-campo">Descripción</label>
                <textarea id="descripcion" name="descripcion" required rows="4" maxlength="2000" class="input"></textarea>
            </div>

            <div class="flex flex-col gap-2">
                <label for="fecha" class="etiqueta-campo">Fecha</label>
                <input id="fecha" name="fecha" type="date" required class="input-linea"
                       th:max="${T(java.time.LocalDate).now()}">
            </div>

            <div class="flex flex-col gap-2">
                <label for="soporte" class="etiqueta-campo">Adjunto</label>
                <input id="soporte" name="soporte" type="file" class="input-linea">
                <p class="m-0 text-[12px] text-neutral-600">Opcional — por ejemplo, una carta firmada.</p>
            </div>

            <button type="submit" class="btn btn-primary self-start px-[18px] py-4 text-[14px] uppercase tracking-[0.06em]">
                Registrar
            </button>
        </form>
    </section>

    <section class="flex flex-col gap-4">
        <h2 class="m-0 text-[22px]">Historial</h2>
        <article th:each="r : ${registros}" class="card p-5"
                 th:classappend="${r.tipo.name() == 'RECONOCIMIENTO'} ? 'border-l-[3px] border-accent' : 'border-l-[3px] border-neutral-400'">
            <div class="flex flex-wrap items-baseline justify-between gap-3">
                <span class="card-kicker" th:text="${r.tipo.name() == 'RECONOCIMIENTO'} ? 'Reconocimiento' : 'Llamado de atención'">Tipo</span>
                <span class="text-[12px] text-neutral-600" th:text="${#temporals.format(r.fecha, 'dd/MM/yyyy')}">01/01/2026</span>
            </div>
            <h3 class="m-0 mt-1 text-[16px]" th:text="${r.titulo}">Título</h3>
            <p class="m-0 mt-2 whitespace-pre-line text-[14px] text-neutral-700" th:text="${r.descripcion}">Descripción</p>
            <p class="m-0 mt-2 text-[12px] text-neutral-600">Registrado por <span th:text="${r.registradoPor.nombre}">—</span></p>
            <a th:if="${r.archivoSoporteClave != null}" th:href="@{'/reconocimientos/' + ${r.id} + '/soporte'}"
               class="mt-2 inline-block text-[13px]">Ver adjunto</a>
        </article>

        <p th:if="${#lists.isEmpty(registros)}" class="text-[14px] text-neutral-700">
            Todavía no hay registros para esta persona.
        </p>
    </section>

</th:block>
</body>
</html>
